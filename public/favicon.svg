<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  <!-- Mountain contour / elevation cross section -->
  <path d="M6 50 L20 34 L32 42 L46 22 L58 46 L58 52 L6 52 Z" fill="#334155" opacity="0.6"/>
  <!-- Tank chassis -->
  <rect x="20" y="44" width="24" height="7" rx="3" fill="#22c55e"/>
  <!-- Tank turret -->
  <circle cx="32" cy="42" r="6" fill="#16a34a"/>
  <!-- Tank barrel aiming up-right -->
  <line x1="32" y1="41" x2="48" y2="30" stroke="#4ade80" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Trajectory arc -->
  <path d="M48 30 Q 54 22 58 20" stroke="#f59e0b" stroke-width="2" stroke-dasharray="2 2" fill="none"/>
  <!-- Crosshair ring -->
  <circle cx="32" cy="32" r="26" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.4"/>
</svg>
